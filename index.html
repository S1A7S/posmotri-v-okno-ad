<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Посмотри в окно — локальный каталог видео с поиском по времени суток.">
  <title>Посмотри в окно</title>
  <link rel="stylesheet" href="./styles/style.css">
  <script src="./scripts/script.js" defer></script>
</head>
<body class="page">
  <header class="header">
    <h1 class="header__title"><span>По</span>смотри<br>в окно</h1>
    <p class="header__description">Выберите время. Найдите своё окно.</p>
  </header>
  <main class="content">
    <section class="search" aria-labelledby="search-title">
      <h2 class="search__title" id="search-title">Когда посмотрим?</h2>
      <form class="search-form" novalidate>
        <fieldset class="search-form__fieldset">
          <legend class="search-form__legend">Время съёмки</legend>
          <div class="search-form__range">
            <label class="search-form__field">С
              <input class="search-form__textfield" name="from" inputmode="numeric" placeholder="00:00" maxlength="5" aria-describedby="range-hint search-error">
            </label>
            <label class="search-form__field">По
              <input class="search-form__textfield" name="to" inputmode="numeric" placeholder="23:59" maxlength="5" aria-describedby="range-hint search-error">
            </label>
          </div>
          <p class="search-form__hint" id="range-hint">Формат ЧЧ:ММ. Пустой диапазон — любое время.</p>
        </fieldset>
        <fieldset class="search-form__fieldset">
          <legend class="search-form__legend">Время суток</legend>
          <div class="search-form__periods">
            <label class="search-form__checkbox-label">
              <input class="search-form__checkbox visually-hidden" type="checkbox" name="period" value="day">
              <span class="search-form__pseudo-checkbox" aria-hidden="true"></span>День
            </label>
            <label class="search-form__checkbox-label">
              <input class="search-form__checkbox visually-hidden" type="checkbox" name="period" value="night">
              <span class="search-form__pseudo-checkbox" aria-hidden="true"></span>Ночь
            </label>
          </div>
        </fieldset>
        <button class="button search-form__submit-button" type="submit">Найти</button>
        <p class="search-form__error" id="search-error" role="alert"></p>
      </form>
    </section>
    <section class="results" aria-labelledby="results-title" aria-busy="false">
      <div class="results__heading">
        <h2 class="results__title" id="results-title">Окна</h2>
        <p class="results__summary" role="status" aria-live="polite"></p>
      </div>
      <p class="preloader" role="status" hidden>Загружаем окна…</p>
      <div class="results__error" role="alert" hidden>
        <p class="results__error-text"></p>
        <button class="button results__retry" type="button">Повторить</button>
      </div>
      <ul class="content__list"></ul>
    </section>
  </main>
  <footer class="footer"><p>Посмотри в окно · локальная видеотека</p></footer>
  <template id="video-card-template">
    <li class="content__list-item">
      <article class="video-card">
        <div class="video-card__media">
          <video class="video-card__video" controls playsinline preload="none"></video>
          <span class="video-card__label"></span>
        </div>
        <div class="video-card__body">
          <h3 class="video-card__title"></h3>
          <p class="video-card__description"></p>
          <p class="video-card__time"></p>
          <p class="video-card__error" hidden>Ролик недоступен. Проверьте локальный файл, указанный в data/videos.json.</p>
        </div>
      </article>
    </li>
  </template>
</body>
</html>
